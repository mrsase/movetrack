name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: |
          npm ci
          (cd server && npm ci)
          (cd client && npm ci)

      - name: Verify (types, lint, tests, build)
        run: npm run verify

      - name: End-to-end smoke
        run: npm run smoke
